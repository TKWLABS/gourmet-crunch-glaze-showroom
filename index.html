<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0a09">
  <title>Gourmet Soup Lab — Luxury Showroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070707;
      --bg-soft: #121110;
      --panel: #0f0d0c;
      --ink: #f2e8d6;
      --muted: #b8af9d;
      --gold: #d7af52;
      --gold-soft: #f4d17b;
      --gold-deep: #a67a2c;
      --line: rgba(215,175,82,0.6);
      --shadow: rgba(0,0,0,0.42);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #b8b3ae;
      color: var(--ink);
      font-family: "DM Sans", Arial, sans-serif;
      line-height: 1.5;
    }

    .showroom {
      max-width: 1460px;
      min-height: 100vh;
      margin: 0 auto;
      background:
        radial-gradient(circle at 20% 10%, rgba(79, 126, 150, 0.38), transparent 28%),
        radial-gradient(circle at 76% 14%, rgba(92, 62, 178, 0.55), transparent 25%),
        linear-gradient(135deg, #0d1117 0%, #0d1117 30%, #0d0d0f 100%);
      padding: 24px 32px 0;
      position: relative;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      position: relative;
      z-index: 3;
    }

    .close-btn {
      background: rgba(15,17,20,0.9);
      border: 1px solid rgba(255,255,255,0.18);
      color: #f2e8d6;
      font-size: 15px;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .device-btn {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.22);
      display: grid;
      place-items: center;
      color: #fff;
      backdrop-filter: blur(6px);
    }

    .publish-btn {
      background: linear-gradient(135deg, rgba(172,127,255,0.34), rgba(36,38,67,0.7));
      border: 1px solid rgba(255,255,255,0.22);
      color: #fefefe;
      border-radius: 999px;
      padding: 12px 22px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

    .hero-shell {
      position: relative;
      z-index: 2;
      padding: 8px 0 0;
    }

    .hero-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .add-btn {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2.4rem, 3vw, 4rem);
      letter-spacing: -0.04em;
      font-weight: 700;
      color: #8ef0ff;
      text-shadow: 0 0 10px rgba(142,240,255,0.2);
      margin: 0;
      line-height: 1;
    }

    .hero-quote {
      font-family: "Playfair Display", Georgia, serif;
      font-style: italic;
      font-size: clamp(1.3rem, 2vw, 2.5rem);
      color: #f0d68c;
      text-align: center;
      flex: 1;
      max-width: 760px;
      line-height: 1.2;
      margin: 0;
      letter-spacing: 0.02em;
    }

    .brand-seal-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      margin: 8px 0 18px;
    }

    .brand-seal {
      width: min(72vw, 520px);
      aspect-ratio: 1;
      display: block;
      filter: drop-shadow(0 16px 26px rgba(0,0,0,0.35));
    }

    .product-grid {
      display: grid;
      grid-template-columns: 1.3fr 0.9fr;
      gap: 30px;
      align-items: center;
      margin-top: 8px;
    }

    .main-card {
      position: relative;
      min-height: 420px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(214,175,82,0.38);
      box-shadow: 0 24px 50px rgba(0,0,0,0.22);
      background: rgba(0,0,0,0.22);
    }

    .main-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: contrast(1.06) saturate(0.9);
    }

    .portrait-card {
      position: relative;
      min-height: 420px;
      border-radius: 50% 50% 50% 50% / 42% 42% 58% 58%;
      overflow: hidden;
      border: 2px solid rgba(214,175,82,0.5);
      box-shadow: 0 24px 50px rgba(0,0,0,0.25);
      background: rgba(0,0,0,0.15);
    }

    .portrait-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: saturate(0.9) contrast(1.08);
    }

    .bottom-links {
      display: flex;
      gap: 18px;
      padding: 18px 0 12px;
      color: var(--muted);
      font-size: 17px;
    }

    .bottom-links a {
      color: var(--muted);
      text-decoration: none;
    }

    .floating-tag {
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      display: grid;
      place-items: center;
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      backdrop-filter: blur(6px);
    }

    .mini-toggle {
      position: absolute;
      right: 30px;
      bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .mini-toggle .box {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.14);
      display: grid;
      place-items: center;
      color: #fff;
      backdrop-filter: blur(8px);
      font-size: 18px;
    }

    @media (max-width: 950px) {
      .showroom { padding: 18px 18px 0; }
      .hero-row { flex-direction: column; text-align: center; }
      .hero-quote { order: -1; }
      .product-grid { grid-template-columns: 1fr; }
      .brand-seal { width: min(82vw, 420px); }
    }
  </style>
</head>
<body>
  <div class="showroom">
    <div class="topbar">
      <button class="close-btn">Close</button>
      <div class="toolbar">
        <div class="device-btn" aria-label="Responsive preview">▣</div>
        <div class="device-btn" aria-label="Desktop view">◫</div>
        <button class="publish-btn">Publish website</button>
      </div>
    </div>

    <div class="hero-shell">
      <div class="hero-row">
        <h1 class="add-btn">ADD TO BASKET</h1>
        <p class="hero-quote">“INVENTED FOR THE MOST BEAUTIFUL WOMEN OF HER TIME”<br>THE QUEEN OF SOUPS</p>
      </div>

      <div class="brand-seal-wrap">
        <svg class="brand-seal" viewBox="0 0 520 520" role="img" aria-label="Gourmet Soup Lab mark">
          <defs>
            <linearGradient id="gold" x1="0" x2="1">
              <stop offset="0%" stop-color="#f7e6a8"/>
              <stop offset="15%" stop-color="#e7c86e"/>
              <stop offset="35%" stop-color="#d9b259"/>
              <stop offset="50%" stop-color="#f5d98d"/>
              <stop offset="68%" stop-color="#d7aa45"/>
              <stop offset="100%" stop-color="#f0d488"/>
            </linearGradient>
            <linearGradient id="goldDark" x1="0" x2="1">
              <stop offset="0%" stop-color="#a9782c"/>
              <stop offset="50%" stop-color="#f2d78a"/>
              <stop offset="100%" stop-color="#8c6324"/>
            </linearGradient>
          </defs>

          <circle cx="260" cy="260" r="222" fill="none" stroke="url(#gold)" stroke-width="10"/>
          <circle cx="260" cy="260" r="202" fill="none" stroke="url(#goldDark)" stroke-width="2" stroke-dasharray="2 10" opacity="0.8"/>
          <circle cx="260" cy="260" r="182" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.85"/>

          <path id="outerArc" d="M 100 260 A 160 160 0 1 1 420 260 A 160 160 0 1 1 100 260" fill="none"/>
          <text fill="url(#gold)" font-size="29" font-family="Georgia, serif" font-weight="700" letter-spacing="4">
            <textPath href="#outerArc" startOffset="26%" side="left">GOURMET SOUP LAB</textPath>
          </text>

          <path id="lowerArc" d="M 118 260 A 142 142 0 1 1 402 260 A 142 142 0 1 1 118 260" fill="none"/>
          <text fill="url(#gold)" font-size="18" font-family="Georgia, serif" font-style="italic" letter-spacing="3">
            <textPath href="#lowerArc" startOffset="20%">THE SCIENCE OF FLAVOUR</textPath>
          </text>

          <g stroke="url(#gold)" stroke-width="4" fill="none" stroke-linecap="round">
            <path d="M160 240 L 238 168" opacity="0.95"/>
            <path d="M240 168 L 240 110"/>
            <path d="M240 168 L 305 220" opacity="0.9"/>
            <path d="M150 315 L 238 245" opacity="0.9"/>
            <path d="M238 245 L 330 310" opacity="0.9"/>
            <path d="M235 245 L 235 340"/>
            <path d="M185 245 C 190 205, 216 175, 238 170" opacity="0.8"/>
            <path d="M212 185 C 160 170, 130 200, 130 250" opacity="0.7"/>
            <path d="M260 170 C 315 166, 338 202, 335 250" opacity="0.75"/>
            <path d="M285 240 C 335 230, 360 252, 360 310" opacity="0.7"/>
          </g>

          <g stroke="url(#gold)" stroke-width="4" fill="none" stroke-linecap="round" transform="translate(260 260)">
            <path d="M0 -18 L 0 -120"/>
            <path d="M0 -120 L 54 -84"/>
            <path d="M0 -120 L -54 -84"/>
            <path d="M-90 16 L 90 16" stroke-width="3"/>
            <path d="M0 16 L 0 96"/>
            <path d="M-18 96 L 18 96"/>
          </g>

          <g fill="url(#gold)" stroke="url(#gold)" stroke-width="1">
            <path d="M98 184 l5 0 l2 5 l2 -5 l5 0 l-4 4 l2 5 l-5 -3 l-5 3 l2 -5 z"/>
            <path d="M424 185 l5 0 l2 5 l2 -5 l5 0 l-4 4 l2 5 l-5 -3 l-5 3 l2 -5 z"/>
            <path d="M106 340 l5 0 l2 5 l2 -5 l5 0 l-4 4 l2 5 l-5 -3 l-5 3 l2 -5 z"/>
            <path d="M414 340 l5 0 l2 5 l2 -5 l5 0 l-4 4 l2 5 l-5 -3 l-5 3 l2 -5 z"/>
          </g>

          <g fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.9">
            <path d="M132 128 C 160 110, 188 108, 210 120"/>
            <path d="M308 120 C 331 108, 360 110, 386 127"/>
            <path d="M130 390 C 165 407, 194 412, 213 401"/>
            <path d="M390 390 C 357 406, 330 412, 308 401"/>
          </g>
        </svg>
      </div>

      <div class="product-grid">
        <div class="main-card">
          <img src="https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=1200&q=80" alt="Ayrshire soup" />
        </div>
        <div class="portrait-card">
          <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80" alt="Portrait of a noblewoman" />
        </div>
      </div>
    </div>

    <div class="bottom-links">
      <a href="#">Terms &amp; Support</a>
      <a href="#">Privacy Policy</a>
    </div>
  </div>
</body>
</html>
